# Pings the Render free-tier backend so it does not spin down from inactivity.
# Render sleeps after ~15 minutes with no HTTP traffic.
#
# Setup (one time):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Name:  RENDER_HEALTH_URL
#   Value: https://YOUR-SERVICE.onrender.com/health
#
# Free external alternatives: cron-job.org or UptimeRobot (same URL, every 10–14 min).

name: Keep Render alive

on:
  schedule:
    # Every 10 minutes (UTC). Keeps Render free tier under the ~15 min idle limit.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret is not set. Skip ping."
            echo "Add it in: Settings → Secrets and variables → Actions"
            exit 0
          fi

          echo "Pinging $RENDER_HEALTH_URL"
          http_code=$(curl -sS -o /tmp/health-response.txt -w "%{http_code}" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            "$RENDER_HEALTH_URL")

          echo "HTTP status: $http_code"
          cat /tmp/health-response.txt

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Health check failed"
            exit 1
          fi

          echo "OK — backend is awake"
